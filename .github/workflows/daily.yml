name: 值得买每日优惠推送

on:
  schedule:
    # GitHub 的 cron 走 UTC。北京时间 10:00 和 18:00 = UTC 02:00 和 10:00
    # 注意：GitHub 的定时触发在整点前后负载高，实际可能延迟几分钟到半小时。
    - cron: "0 2,10 * * *"
  workflow_dispatch:
    inputs:
      no_notify:
        description: "Test mode: run everything but send no notification"
        type: boolean
        default: false

permissions:
  contents: write

# 同一时间只跑一个，避免手动触发和定时撞车导致重复推送
concurrency:
  group: smzdm-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub Actions 默认 UTC，日报里的时间要显示北京时间必须显式指定，
    # 否则「抓取 22:36」会写成「14:36」，last_push 的日期也可能差一天。
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 恢复商品目录与运行状态
        run: |
          mkdir -p build/cache build/state
          if [ -f data/catalog.json ]; then
            cp data/catalog.json build/cache/catalog.json
            echo "已恢复商品目录：$(wc -c < data/catalog.json) 字节"
          else
            echo "首次运行，目录为空"
          fi
          if [ -f data/pool.json ]; then
            cp data/pool.json build/cache/pool.json
            echo "已恢复 24 小时商品池"
          fi
          for f in last_push.txt cooldown_until.txt blocked_streak.txt; do
            if [ -f "data/state/$f" ]; then cp "data/state/$f" build/state/; fi
          done

      - name: 生成配置
        run: |
          cp config.example.ini config.ini
          echo "配置已生成（SendKey 由 Secrets 注入，不落盘到仓库）"

      - name: 抓取 · 生成报表 · 推送
        id: run
        continue-on-error: true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          NO_NOTIFY: ${{ inputs.no_notify }}
        run: |
          if [ "$NO_NOTIFY" = "true" ]; then
            echo "== test mode: notifications are off =="
            python daily.py --no-notify
          else
            python daily.py
          fi

      - name: 回写数据与报表
        if: always()
        run: |
          mkdir -p data/state docs
          if [ -f build/cache/catalog.json ]; then
            cp build/cache/catalog.json data/catalog.json
          fi
          if [ -f build/cache/pool.json ]; then
            cp build/cache/pool.json data/pool.json
          fi
          if [ -f build/db.json ]; then
            cp build/db.json docs/db.json
            echo "已更新 docs/db.json"
          fi
          # 兜底数据源：wishlist 的实时读取失败时，页面退回读这个同域副本
          if [ -f watchlist.txt ]; then
            cp watchlist.txt docs/watchlist.txt
            echo "已同步 docs/watchlist.txt"
          fi
          for f in last_push.txt cooldown_until.txt blocked_streak.txt; do
            if [ -f "build/state/$f" ]; then cp "build/state/$f" data/state/; fi
          done
          latest=$(ls -t build/reports/*.html 2>/dev/null | head -1 || true)
          if [ -n "$latest" ]; then
            cp "$latest" docs/index.html
            echo "已更新 docs/index.html ← $latest"
          else
            echo "本次没有生成报表"
          fi
          # 运行历史供 docs/overview.html 读取
          if [ -f build/cache/run_history.json ]; then
            cp build/cache/run_history.json docs/history.json
            echo "已更新 docs/history.json"
          fi

      - name: 提交变更
        if: always()
        run: |
          git config user.name "smzdm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: $(date -u +%F) 优惠数据更新"
            # 期间可能有别的提交（比如手动改配置），先 rebase 再推，失败重试
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                echo "已推送（第 $i 次尝试）"
                break
              fi
              echo "推送失败，3 秒后重试"
              sleep 3
            done
          fi

      - name: 失败时打印日志
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::抓取或推送失败，最近日志如下"
          tail -40 build/logs/runs.log 2>/dev/null || echo "（无日志）"
          exit 1
