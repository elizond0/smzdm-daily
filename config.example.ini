; 值得买每日优惠推送 —— 配置
; 改完直接保存，下次运行生效。所有项都有默认值，留空即用默认。

[push]
; 微信推送总开关。false = 只生成日报、不发微信（报表和入库照常）
;
; >>> 注意：这里的 false 是【使用者的刻意选择，属预期状态】，不是故障、不是漏配。<<<
; 需求是「只要能上 GitHub Pages 看新数据即可，不要微信打扰」，故常年保持 false。
; 迁移/排查时不要「顺手帮忙」改成 true——那会突然冒出推送打扰使用者。
; 真要恢复到微信推送时，须由使用者本人明确要求。详见《部署必读.md》第一节状态表。
enabled = false

; Server酱 SendKey（Sct 开头）。获取：https://sct.ftqq.com 微信扫码登录后复制。
; 这里故意留空——真实密钥放在 GitHub Secrets（SERVERCHAN_SENDKEY），不要写进仓库。
; 本机运行时请改 config.ini（该文件已被 .gitignore 排除）。
serverchan_sendkey = 

; 日报网页地址（GitHub Pages），微信推送里会带上这个链接
site_url = https://elizond0.github.io/smzdm-daily/

; 桌面通知开关
desktop_notify = true

[filter]
; 一条推送里最多放几条
max_items = 10

; 折扣判定：现价 / 原价 × 100，低于这个数就算「力度大」（35 = 3.5 折）
min_discount_pct = 35

; 或者立省金额超过这个数，也算力度大
; 价格上限，过滤掉手机电脑这类高价消费（0 = 不限）
max_price = 5000

; 凑单 / 淘金币 / 试用 这类商品默认保留，只在标签上标注提醒。
; 如果哪天想把其中某类彻底排除，在这里填（逗号分隔），例如：exclude_conds = 试用
exclude_conds =

[interest]
; 只推这些品类，逗号分隔（中英文逗号都行）。留空 = 不限品类，所有品类都推。
; 可选：食品生鲜 / 电脑数码 / 家用电器 / 日用百货 / 酒类 / 其他
categories =

; 标题里含这些词就不推，逗号分隔。优先级最高。
block_keywords = 香烟,电子烟,彩票

; 白名单：填了之后，只有标题含这些词的商品才推（留空 = 不启用）。
; 适合某段时间只盯某个牌子，比如：only_keywords = 蒙牛,伊利
only_keywords =

[quality]
; 热度门槛：点「值」数 或 评论数，满足其中一个即可。设为 0 = 该条件不启用。
; 列表页能拿到这两个绝对数；「值率」需要进详情页（有风控），本工具不取。
min_zhi = 10
min_comment = 10

[dedup]
; 一个商品推过之后，多少天内不再重复推（0 = 不去重）
days = 7

; 但只要价格比上次推的时候更低，就照推。
; 这里填容忍幅度：0 = 便宜一分钱也推；5 = 要便宜 5% 以上才推
price_drop_pct = 0

[crawl]
; 每天最多发多少个请求（硬上限，超了直接停）
request_budget = 8

; 两次请求之间的随机间隔（秒）。云端出口是数据中心 IP，比家用宽带更
; 容易进观察名单，所以这里放得比本地更宽（本地 config.ini 是 6-12）。
interval_min = 15
interval_max = 30

; 数据源是「全部好价排行榜 · 12H最热」，每页约 18-20 条。
; 抓 5 页 ≈ 95 条；抓到的全部入库，用于历史低价对比。
feed_pages = 5

; 好价榜只展示前 N 名（不影响入库数量）
top_n = 20

; 被风控拦截后冷却几小时（期间不再请求，绝不重试）
cooldown_hours = 6

[watch]
; 关注列表的在线编辑地址（在日报页面点「编辑关注列表」会跳到这里）
edit_url = https://github.com/elizond0/smzdm-daily/edit/main/watchlist.txt

; 愿望单文件的原始地址，日报页面用它实时读取关键词
raw_url = https://raw.githubusercontent.com/elizond0/smzdm-daily/main/watchlist.txt

; 愿望单的 API 地址，日报页面优先用它（国内比 raw 域名可靠）
api_url = https://api.github.com/repos/elizond0/smzdm-daily/contents/watchlist.txt
